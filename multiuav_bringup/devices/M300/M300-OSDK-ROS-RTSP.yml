#https://github.com/paulfioravanti/dotfiles/blob/062005ecf6c98675949fa8b5ce8866d918e2f040/tmuxinator/exercism.yml#L88
# Set var "ns" and 'mode' to workdir

<% 
default_ns = 'uav_14'
Config_cmd = 'M300-sim-on'

if @settings["ns"] 
  uav_ns = @settings["ns"] 
else 
  uav_ns = default_ns 
end 
if @settings["mode"]
  if @settings["mode"] == 'real' 
     Config_cmd = 'M300-real' 
  end 
end %>

name: dji_mission
root: ~/

on_project_start: echo "Starting M300"
on_project_exit: docker stop muavgcs_noetic && tmux kill-window -t dji_mission 

on_project_first_start:
  - echo " initializing M300"
  - 'echo  "name_space: <%=uav_ns%>" mode: <%= Config_cmd %> '
  - sleep 5
  <% if @args[0]  == "-h" %>
  - echo "Usage keys values "
  - echo "mode=real or sim   -default sim"
  - 'echo "ns=15              -default  <%= default_ns %>"'
  - sleep 5
  - exit
  <% end %>




windows:
  - M210-sim:
      layout: tiled
      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      panes:
        - config:
            - ~/app_ros1/docker/container_run.sh
            - source ~/app_ws/devel/setup.bash
            - sleep 2
            - <%= Config_cmd %>
            - sleep 20
            - 'rosservice call /<%= uav_ns %>/setup_camera_stream "{cameraType: 1, start: 1}"'
        - mission:
            - ~/app_ros1/docker/container_run.sh
            - source ~/app_ws/devel/setup.bash
            - sleep 2
            - sleep 10
            - roslaunch onboard_dji run_M300-rtsp.launch uav_id:=<%= uav_ns %>
        - multimaster:
            - ~/app_ros1/docker/container_run.sh
            - source ~/app_ws/devel/setup.bash
            - sleep 2
            - myrosversion=$(rosversion -d)
            - roslaunch onboard_dji multimaster-noetic.launch 

        - resize:
            - ~/app_ros1/docker/container_run.sh
            - source ~/app_ws/devel/setup.bash
            - sleep 2