# Config de ros_rtsp del M210 (uav_2). Origen: multiuav_bringup/devices/ros-rtsp/stream_setup.yaml (la versionada;
# reemplaza a la que se había derivado del M300). ros_rtsp la lee de $(find ros_rtsp)/config/stream_setup.yaml sin
# argumento: container_run.sh la monta encima.
# OJO: namespace uav_2 fijo en los topics. Si el dron usa otro id, cambiarlo aquí.
port: '8554'
streams: # Cannot rename - must leave this as is.
  stream-yay:
    type: topic
    source: /uav_2/dji_osdk_ros/fpv_camera_images
    mountpoint: /fpv
    caps: video/x-raw,framerate=10/1,width=640,height=480
    bitrate: 500

  stream-xt2:
    type: topic
    source: /uav_2/dji_osdk_ros/main_camera_images
    mountpoint: /main
    caps: video/x-raw,framerate=10/1,width=1280,height=720
    bitrate: 500

  stream-xt3:
    type: topic
    source: /uav_2/dji_osdk_ros/main_camera_images_resize
    mountpoint: /main_resize
    caps: video/x-raw,framerate=10/1,width=608,height=448
    bitrate: 500
